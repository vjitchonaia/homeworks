<html>

    <head>
        <link rel="stylesheet" href="style.css">
    </head>


    <body>
        <section>

            <div class="container">

                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
                <div class="box4"></div>

                <div class="card">

                    <div class="header">

                    <img src="images/logo.jpg" alt="logo">
                    <h2>SERVICE REQUEST REPORT</h2>

                    </div>

                    <div class="form">

                        <h4>Costumer Information:</h4>

                        <form>

                        <div class="form1"> 

                            <div class="detail">
                            <label for="costumer-name">Costumer Name:</label>
                            <input type="text" id="costumer-name" name="costumer-name">
                            </div>

                            <div class="detail">
                            <label for="phone">Contact Number:</label>
                            <input type="tel" id="phone" name="phone">
                            </div>

                        </div>

                        <div class="form1"> 

                            <div class="detail">
                            <label for="costumer-mail">Email Adress:</label>
                            <input type="email" id="costumer-mail" name="costumer-mail">
                            </div>

                            <div class="detail">
                            <label for="adress">Home Adress:</label>
                            <input type="text" id="adress" name="adress">
                            </div>

                        </div>

                        </form>

                    </div>

                    <div class="form">

                        <h4>Service Request Details:</h4>

                        <p>Requested:</p>

                        <form>

                        <div class="form2">

                        <div class="pr">
                        <input type="radio" id="repair" name="requested">
                        <label for="repair">Repair</label><br>
                        </div>

                        <div class="pr">
                        <input type="radio" id="maintenance" name="requested">
                        <label for="maintenance">Maintenance</label><br>
                        </div>

                        <div class="pr">
                        <input type="radio" id="installation" name="requested">
                        <label for="installation">Installation</label>
                        </div>

                        <div class="pr">
                        <input type="radio" id="other" name="requested">
                        <label for="other">Other</label>
                        </div>

                        </div>

                        <div class="detail2">
                        <label for="dsr">Description of Service Requested:</label>
                        <input type="text" id="dsr" name="description-service-requested">
                        </div>

                        <div class="detail2">
                        <label for="dtr">Date and Time Requested:</label>
                        <input type="date" id="dtr" name="date-time-requested">
                        </div>

                        <p>Urgency Level:</p>

                        <div class="form2">

                        <div class="pr">
                        <input type="radio" id="low" name="urgency-level">
                        <label for="low">Low</label><br>
                        </div>

                        <div class="pr">
                        <input type="radio" id="medium" name="urgency-level">
                        <label for="medium">Medium</label><br>
                        </div>

                        <div class="pr">
                        <input type="radio" id="high" name="urgency-level">
                        <label for="high">High</label>
                        </div>

                        <div class="pr">
                        <input type="radio" id="emergency" name="urgency-level">
                        <label for="emergency">Emeregency</label>
                        </div>

                        </div>

                        

                        </form>

                    </div>

                    <div class="form">
                        <h4>Aprroval:</h4>

                        <div class="approval">

                        <div class="detail3">
                        <label for="dsr">Description of Service Requested:</label>
                        <input type="text" id="dsr" name="description-service-requested">
                        </div>

                        <div class="detail3">
                        <label for="dsr">Description of Service Requested:</label>
                        <input type="text" id="dsr" name="description-service-requested">
                        </div>

                        </div>

                    </div>

                    <div class="form">
                        <h4>Service Personnel:</h4>

                        <div class="form3"> 

                            <div class="detail4">
                            <label for="cb">Completed by:</label>
                            <input type="text" id="cb" name="service-personnel">
                            </div>

                            <div class="detail4">
                            <label for="date">Date:</label>
                            <input type="date" id="date" name="service-personnel">
                            </div>

                            

                        </div>

                         <div class="form3"> 

                            <div class="detail4">
                            <label for="ab">Approved by:</label>
                            <input type="text" id="ab" name="service-personnel">
                            </div>

                            <div class="detail4">
                            <label for="phone">Date:</label>
                            <input type="date" id="date" name="service-personnel">
                            </div>

                            

                        </div>

                    </div>

                </div>

            </div>

        </section>
    </body>

</html>
